<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Event Management</title>
  <meta name="description" content="Daftar akun baru untuk sistem manajemen event">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Buat Akun Baru</h1>
      <p class="subtitle">Daftar untuk mengakses event</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" maxlength="16" required>
          <div class="field-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="contoh@email.com" required>
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Buat password" required>
          <div class="password-rules">
            <span id="ruleLength">Min. 8 karakter</span>
            <span id="ruleUpper">Huruf besar</span>
            <span id="ruleLower">Huruf kecil</span>
            <span id="ruleNumber">Angka</span>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password</label>
          <input type="password" id="confirmPassword" placeholder="Ulangi password" required>
          <div class="field-error" id="confirmError"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="registerBtn">
          <span id="registerText">Daftar</span>
        </button>
      </form>

      <div class="auth-link">
        Sudah punya akun? <a href="index.html">Masuk disini</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (getToken()) window.location.href = 'events.html';

    const pw = document.getElementById('password');
    const rules = { ruleLength: v => v.length >= 8, ruleUpper: v => /[A-Z]/.test(v), ruleLower: v => /[a-z]/.test(v), ruleNumber: v => /[0-9]/.test(v) };

    pw.addEventListener('input', () => {
      const v = pw.value;
      Object.entries(rules).forEach(([id, fn]) => {
        document.getElementById(id).classList.toggle('pass', fn(v));
      });
    });

    const form = document.getElementById('registerForm');
    const btn = document.getElementById('registerBtn');
    const btnText = document.getElementById('registerText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = pw.value;
      const confirm = document.getElementById('confirmPassword').value;

      ['usernameError','emailError','passwordError','confirmError'].forEach(id => document.getElementById(id).textContent = '');
      document.querySelectorAll('.form-group input').forEach(i => i.classList.remove('error'));

      let valid = true;
      const setErr = (id, msg) => { document.getElementById(id).textContent = msg; valid = false; };

      if (!username || username.length < 3) setErr('usernameError', 'Username minimal 3 karakter');
      if (username.length > 16) setErr('usernameError', 'Username maksimal 16 karakter');

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email) setErr('emailError', 'Email wajib diisi');
      else if (!emailRegex.test(email)) setErr('emailError', 'Format email tidak valid');

      if (!password) setErr('passwordError', 'Password wajib diisi');
      else if (password.length < 8) setErr('passwordError', 'Password minimal 8 karakter');
      else if (!/[A-Z]/.test(password)) setErr('passwordError', 'Password harus mengandung huruf besar');
      else if (!/[a-z]/.test(password)) setErr('passwordError', 'Password harus mengandung huruf kecil');
      else if (!/[0-9]/.test(password)) setErr('passwordError', 'Password harus mengandung angka');

      if (password !== confirm) setErr('confirmError', 'Password tidak cocok');

      if (!valid) return;

      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Memproses...';

      try {
        await apiFetch('/auth/register', { method: 'POST', body: JSON.stringify({ username, email, password }) });
        showToast('Registrasi berhasil! Silakan login.');
        setTimeout(() => window.location.href = 'index.html', 1200);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Daftar';
      }
    });
  </script>
</body>
</html>
